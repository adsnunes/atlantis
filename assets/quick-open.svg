<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Atlantis Quick Open</title><desc id="desc">Quick Open heading navigation panel</desc>
  <rect width="1200" height="680" rx="24" fill="#07161e"/>
  <rect x="36" y="32" width="1128" height="616" rx="16" fill="#0c2730" stroke="#184e5b" stroke-width="3"/>
  <text x="600" y="98" text-anchor="middle" fill="#d3f3f1" font-family="monospace" font-size="34" font-weight="bold" letter-spacing="4">QUICK OPEN</text>
  <text x="82" y="160" fill="#5b8f97" font-family="monospace" font-size="24">jump to heading:</text><text x="380" y="160" fill="#34cfc4" font-family="monospace" font-size="24">design</text><rect x="475" y="138" width="3" height="30" fill="#75e8df"/>
  <line x1="82" y1="190" x2="1118" y2="190" stroke="#184e5b" stroke-width="2"/>
  <rect x="70" y="220" width="1060" height="58" rx="8" fill="#0f4650"/><text x="96" y="258" fill="#75e8df" font-family="monospace" font-size="24">▸</text><text x="132" y="258" fill="#d3f3f1" font-family="monospace" font-size="25" font-weight="bold">Design principles</text>
