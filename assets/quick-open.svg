  <text x="132" y="402" fill="#5b8f97" font-family="monospace" font-size="25">Visual language</text>
  <text x="132" y="474" fill="#5b8f97" font-family="monospace" font-size="25">Keyboard map</text>
  <text x="82" y="596" fill="#5b8f97" font-family="monospace" font-size="22">↑↓ move   enter jump   esc close</text>
